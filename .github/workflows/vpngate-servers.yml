name: Refresh server catalog

# Hourly catalog for BULBVPN clients. Devices never call VPN Gate directly;
# they load data/vpngate.json from this repo (raw / jsDelivr).

on:
  schedule:
    # GitHub only runs cron from the default branch.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and write data/vpngate.json
        run: python3 scripts/fetch_vpngate.py

      - name: Commit when the list changed
        run: |
          git add data/vpngate.json
          if git diff --cached --quiet; then
            echo "Server list is unchanged."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore: refresh server catalog"
          git push
